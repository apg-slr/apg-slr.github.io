. Hu, X. Xia, Y. Gao, T. Xu, D. Lo, X. Yang", "title": "Exploiting Library Vulnerability via Migration Based Automating Test Generation", "year": 2024, "venue": "International Conference on Software Engineering", "theme": "Software Engineering", "doi": "10.1145/3597503.3639583", "bibtex": "@CONFERENCE{Chen20242820,\n\tauthor = {Chen, Zirui and Hu, Xing and Xia, Xin and Gao, Yi and Xu, Tongtong and Lo, David and Yang, Xiaohu},\n\ttitle = {Exploiting Library Vulnerability via Migration Based Automating Test Generation},\n\tyear = {2024},\n\tjournal = {Proceedings - International Conference on Software Engineering},\n\tpages = {2820 – 2831},\n\tdoi = {10.1145/3597503.3639583}\n}", "doctype": "Conference Paper", "idx": 70}];
const tbody = document.getElementById("rows");
const esc = s => String(s).replace(/[&<>"']/g, c =>
  ({"&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;"}[c]));
let sortKey = "no", sortDir = 1;

function studyNum(p) { return parseInt(p.no.replace(/\D/g, "")) || 0; }

function render() {
  const q = document.getElementById("q").value.trim().toLowerCase();
  const list = PAPERS.filter(p => !q ||
    [p.no, p.authors, p.title, p.doctype, p.year, p.venue, p.theme, p.doi].join(" ").toLowerCase().includes(q));
  list.sort((a, b) => {
    const x = sortKey === "no" ? studyNum(a) : a[sortKey];
    const y = sortKey === "no" ? studyNum(b) : b[sortKey];
    return (x > y ? 1 : x < y ? -1 : 0) * sortDir || a.idx - b.idx;
  });
  tbody.innerHTML = list.map(p => `
    <tr>
      <td class="no">${esc(p.no)}</td>
      <td class="authors">${esc(p.authors)}</td>
      <td class="title">
        ${esc(p.title)}
        ${p.bibtex ? `<br><span class="bibtoggle" data-idx="${p.idx}">[BibTeX]</span>
          <div class="bib" id="bib-${p.idx}"><pre>${esc(p.bibtex)}</pre>
          <button data-copy="${p.idx}">Copy</button></div>` : ""}
      </td>
      <td>${esc(p.doctype)}</td>
      <td class="year">${esc(p.year)}</td>
      <td class="venue">${esc(p.venue)}</td>
      <td>${esc(p.theme)}</td>
      <td class="doi">${p.doi ? `<a href="https://doi.org/${esc(p.doi)}" target="_blank" rel="noopener" title="${esc(p.doi)}">DOI</a>` : `<span class="empty">[Empty]</span>`}</td>
    </tr>`).join("");
  document.getElementById("count").textContent =
    list.length === PAPERS.length ? PAPERS.length : `${list.length} of ${PAPERS.length}`;
  document.querySelectorAll("th").forEach(th => {
    th.classList.toggle("sorted-asc", th.dataset.key === sortKey && sortDir === 1);
    th.classList.toggle("sorted-desc", th.dataset.key === sortKey && sortDir === -1);
  });
}

tbody.addEventListener("click", e => {
  const t = e.target.closest(".bibtoggle");
  if (t) {
    document.getElementById("bib-" + t.dataset.idx).classList.toggle("open");
  }
  const b = e.target.closest("button[data-copy]");
  if (b) {
    const p = PAPERS[+b.dataset.copy];
    navigator.clipboard.writeText(p.bibtex).then(() => {
      b.textContent = "Copied"; setTimeout(() => b.textContent = "Copy", 1200);
    });
  }
});
document.querySelectorAll("th").forEach(th => th.addEventListener("click", () => {
  if (sortKey === th.dataset.key) sortDir = -sortDir; else { sortKey = th.dataset.key; sortDir = 1; }
  render();
}));
document.getElementById("q").addEventListener("input", render);
render();
</script>
